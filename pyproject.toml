[project]
name = "eeg-biomarker-explorer"
version = "0.1.0"
description = "Declarative EEG biomarker analysis pipeline built on MNE-Python"
readme = "README.md"
license = { text = "MIT" }
authors = [
    {name = "Vinicius Duarte", email = "viniciusduarte06@gmail.com"}
]
requires-python = ">=3.11"
keywords = ["eeg", "mne", "emdr", "biomarker", "neuroscience", "signal-processing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "mne>=1.12.1,<2.0.0",
    "pandas>=3.0.3,<4.0.0",
    "pyyaml>=6.0.3,<7.0.0",
    "scikit-learn>=1.8.0,<2.0.0",
    "pyarrow>=20.0.0,<21.0.0",
    "pydantic>=2.13.4,<3.0.0",
]

[project.scripts]
eeg-pipe = "eeg_biomarker_explorer.runner:cli"

[project.urls]
Homepage = "https://github.com/viniciusduarte06/eeg-biomarker-explorer"
Repository = "https://github.com/viniciusduarte06/eeg-biomarker-explorer"
Issues = "https://github.com/viniciusduarte06/eeg-biomarker-explorer/issues"

[tool.poetry]
packages = [{include = "eeg_biomarker_explorer", from = "src"}]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

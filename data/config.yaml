analysis: region   # channel | region | both

filters:
  l_freq: 1.0
  h_freq: 35.0

preprocessing:
  line_noise_hz: 60.0          # 50 Hz (EU) or 60 Hz (BR/US)
  reference: average            # average | REST | channel name
  bad_channels:
    z_threshold: 3.0            # flag channels whose std z-score exceeds this
  ica:
    n_components: 15
    method: fastica              # fastica | infomax | picard
    eog_channels: [Fp1, Fp2]    # channels used for EOG artifact detection
  bad_segments:
    peak_amplitude: 150.0e-6    # V — segments exceeding this are marked bad
  epoching:
    tmin: -0.2                  # s before annotation onset
    tmax: 0.8                   # s after annotation onset

regions:
  frontal: [Fp1, Fp2, F3, F4, Fz, F7, F8]
  central: [C3, Cz, C4]
  temporal: [T7, T8]
  parietal: [P3, P4, Pz, P7, P8]
  occipital: [O1, O2]

version: 1

# -----------------------------------------------------------
# Input
# -----------------------------------------------------------
input:

  dataset:
    path: sample                       # "sample" | path to .edf / .fif / .bdf / .set / .vhdr

  events:
    path:        ./data/raw/events.json  # auto-generated when path=sample and file is absent
    condition_a: LABEL_A
    condition_b: LABEL_B

  regions:
    frontal:   [Fp1, Fp2, F3, F4, Fz, F7, F8]
    central:   [C3, Cz, C4]
    temporal:  [T7, T8]
    parietal:  [P3, P4, Pz, P7, P8]
    occipital: [O1, O2]

# -----------------------------------------------------------
# Pipeline — steps run in order; insert plot anywhere
# -----------------------------------------------------------
pipeline:

  preprocessing:
    - filter:
        l_freq: 1.0
        h_freq: 35.0

    - line_noise:
        freq: 60.0         # 50 Hz (EU) | 60 Hz (BR/US)

    - bad_channels:
        z_threshold: 3.0

    - rereference:
        method: average

    - ica:
        n_components: 15
        method: fastica
        # eog_channels: [Fp1, Fp2]  # override auto-detection if needed
        eog_threshold: 3.0

    - interpolate:

    - bad_segment_annotation:
        peak_amplitude: 150.0e-6

    - plot:
        title: After preprocessing
        sensitivity: 50    # µV/div

  feature_extraction:
    - spectral_power:
        events: [condition_a, condition_b]
        method: welch
        bands:
          theta: [4, 8]
          alpha: [8, 13]
          beta:  [13, 30]
        groupby: region    # channel | region
        relative: true

    - faa:
        events: [condition_a, condition_b]
        method: welch
        channels:
          left: F3
          right: F4

output:
  format: [csv, parquet]
  path: ./data/processed

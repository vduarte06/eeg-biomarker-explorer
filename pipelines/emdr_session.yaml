version: 1

input:

  dataset:
    path: ./data/raw/01_emdr_session.edf                     # "sample" | path to .edf / .fif / .bdf / .set / .vhdr

  events:
    path:     ./data/raw/events.json  # session log with timestamps → annotations
    emdr:     EMDR_T
    baseline: INTROCEPTION

  regions:
    frontal:   [EEG Fp1, EEG Fp2, EEG F3, EEG F4, EEG Fz, EEG F7, EEG F8] # notice that the channel names are EEG prefixed in our EDF file
    central:   [EEG C3, EEG Cz, EEG C4]
    temporal:  [EEG T7, EEG T8]
    parietal:  [EEG P3, EEG P4, EEG Pz, EEG P7, EEG P8]
    occipital: [EEG O1, EEG O2]


pipeline:

  # Signal cleaning — steps run in order
  preprocessing:
    - plot:
        title: Raw signal
        sensitivity: 50              # µV/div

    - filter:
        l_freq: 0.5
        h_freq: 35.0

    - line_noise:
        freq: 60.0

    - bad_channels:
        z_threshold: 3.0

    - rereference:
        method: average

    - ica:
        n_components: 20
        method: fastica
        eog_channels: [EEG Fp1, EEG Fp2]  # set to override auto-detection; omit to use dedicated EOG channels
        eog_threshold: 3.0          # lower (e.g. 2.5) to catch more components

    # - interpolate:

    - bad_segment_annotation:
        peak_amplitude: 150.0e-6

    - plot:
        title: After preprocessing
        sensitivity: 50              # µV/div

  # Metrics computed on the cleaned, annotated signal — steps run in order
  feature_extraction:
    - spectral_power:
        events: [emdr, baseline]
        method: welch
        bands:
          theta: [4, 8]
          alpha: [8, 12]
          beta:  [12, 30]
        groupby: region              # channel | region
        relative: true

    - peak_power:
        events: [emdr, baseline]
        method: welch
        bands:
          theta: [4, 8]
          alpha: [8, 12]
        groupby: region

    - faa:
        events: [emdr, baseline]
        method: welch
        channels:
          left: EEG F3
          right: EEG F4

output:
  format: [csv]
  path: ./data/processed
